name: Deploy to CloudPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to CloudPanel Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            # Ensure Node.js and PM2 paths are accessible in non-interactive shells
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:$HOME/.local/bin:$HOME/bin

            # Navigate to website directory
            cd ${{ secrets.TARGET_DIR }}

            echo "==> Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing dependencies..."
            npm ci --prefer-offline 2>/dev/null || npm install

            echo "==> Building Next.js & Payload CMS..."
            npm run build

            echo "==> Reloading PM2 process..."
            APP_NAME="${{ secrets.PM2_APP_NAME || 'venus-cms' }}"
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$APP_NAME" --update-env
            else
              pm2 start npm --name "$APP_NAME" -- run start
            fi
            pm2 save

            echo "==> Deployment successfully finished!"
