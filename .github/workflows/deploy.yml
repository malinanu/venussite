name: Deploy to CloudPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: CLOUDPANEL_PROD

    steps:
      - name: Configure SSH Key
        env:
          RAW_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if echo "$RAW_SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$RAW_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$RAW_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          # Ensure valid trailing newline and secure permissions
          sed -i -e '$a\' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to CloudPanel Server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            # Ensure Node.js and PM2 paths are loaded
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node 2>/dev/null | tail -n 1)/bin:$PATH:/usr/local/bin:$HOME/.local/bin:$HOME/bin

            # Navigate to website directory
            cd ${{ secrets.TARGET_DIR }}

            if [ ! -d ".git" ]; then
              echo "==> Initializing git repository and linking origin..."
              git init
              git remote add origin https://github.com/malinanu/venussite.git || git remote set-url origin https://github.com/malinanu/venussite.git
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
              git branch --set-upstream-to=origin/main main
            else
              echo "==> Pulling latest changes from main branch..."
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "==> Installing dependencies..."
            npm ci --prefer-offline 2>/dev/null || npm install

            echo "==> Building Next.js & Payload CMS..."
            npm run build

            echo "==> Reloading PM2 process on port 3004..."
            APP_NAME="venus-cms"
            if npx pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              npx pm2 restart "$APP_NAME" --update-env
            else
              npx pm2 start npm --name "$APP_NAME" -- run start
            fi
            npx pm2 save

            echo "==> Deployment successfully finished!"
          EOF
